name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }} - ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ENV: dev
  AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13

    - name: Install dependencies
      run: make deps

    - name: Run dlt linter
      run: make dlt-lint

    - name: Ingest raw data
      run: make dlt-ingest-source-data

    - name: Install dbt dependencies
      run: make dbt-deps

    - name: Run dbt linter
      run: make dbt-lint

    - name: Run dbt models
      run: make dbt-run

    - name: Run dbt unit tests
      run: make dbt-test-unit

    - name: Run dbt data tests
      run: make dbt-test-data

  serve-dbt-docs:
    name: Serve dbt docs
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13

    - name: Install dbt dependencies
      run: make deps && make dbt-deps

    - name: Generate dbt docs
      run: make dbt-docs-generate

    - name: Upload dbt docs as artifact to GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dbt/target

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5
